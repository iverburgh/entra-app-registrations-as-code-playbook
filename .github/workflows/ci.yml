name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scripts:
    name: PowerShell tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./app-registrations/tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  validate-configuration:
    name: Example configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate definitions and environments (offline)
        shell: pwsh
        run: ./app-registrations/Test-AppRegistrationConfig.ps1

  sample-api:
    name: Sample API tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: samples/global.json

      - name: Build
        run: dotnet build samples/Orders.slnx --configuration Release

      - name: Test
        run: dotnet test samples/Orders.slnx --configuration Release --no-build

  leak-check:
    name: No internal references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scan for organisation-specific references
        shell: pwsh
        run: ./tools/Test-NoInternalReferences.ps1
        env:
          # Names that must never be published live in a secret, not in the repository.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check relative links and anchors
        shell: pwsh
        run: ./tools/Test-DocumentationLinks.ps1
